[package]
name = "coorre-cli"
description = "CoorRe command line: narrated devnet demo and audit bundle verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "coorre"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
coorre-anchor = { path = "../coorre-anchor" }
coorre-engine = { path = "../coorre-engine" }
coorre-model = { path = "../coorre-model" }
coorre-verify = { path = "../coorre-verify" }
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["formatting"] }
uuid.workspace = true

[lints]
workspace = true
