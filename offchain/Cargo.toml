[workspace]
resolver = "3"
members = ["crates/coorre-model", "crates/coorre-engine", "crates/coorre-verify", "crates/coorre-anchor", "crates/coorre-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/catitodev/CoorRe"

[workspace.dependencies]
bs58 = "0.5.1"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
uuid = { version = "1.26.1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
