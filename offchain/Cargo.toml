[workspace]
resolver = "3"
members = ["crates/coorre-model"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/catitodev/CoorRe"

[workspace.dependencies]
bs58 = "0.5.1"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
serde = "1.0.229"
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
