name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  offchain:
    name: offchain (fmt, clippy, test, wasm)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: offchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable
          rustc --version
          cargo --version

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: wasm32 build of the verification crates
        run: cargo build -p coorre-model -p coorre-engine --target wasm32-unknown-unknown --release --locked

  bridge:
    name: bridge (npm ci, test, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: npm ci (install scripts disabled by bridge/.npmrc)
        run: npm ci --no-fund

      - name: npm test
        run: npm test

      - name: npm audit (fails on high or critical)
        run: npm audit --audit-level=high

  playground-preflight:
    name: playground preflight (official Playground environment)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/playground-preflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Playground's Rust toolchain (version from reference.json)
        run: rustup toolchain install "$(node -p 'require("./reference.json").legacyTemplate.rustVersion')" --profile minimal

      - name: npm ci (install scripts disabled by .npmrc)
        run: npm ci --no-fund

      - name: Regression cases
        run: npm test

      - name: Preflight against the live official Playground sources
        run: node preflight.mjs
