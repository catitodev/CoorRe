name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  offchain:
    name: offchain (fmt, clippy, test, wasm)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: offchain
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable
          rustc --version
          cargo --version

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: wasm32 build of the verification crates
        run: cargo build -p coorre-model -p coorre-engine -p coorre-verify --target wasm32-unknown-unknown --release --locked

  bridge:
    name: bridge (npm ci, test, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bridge
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Node 24 (actions/setup-node v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: npm ci (install scripts disabled by bridge/.npmrc)
        run: npm ci --no-fund

      - name: npm test
        run: npm test

      - name: npm audit (fails on high or critical)
        run: npm audit --audit-level=high

  playground-preflight:
    name: playground preflight (official Playground environment)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/playground-preflight
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Node 24 (actions/setup-node v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Install Playground's Rust toolchain (version from reference.json)
        run: rustup toolchain install "$(node -p 'require("./reference.json").legacyTemplate.rustVersion')" --profile minimal

      - name: npm ci (install scripts disabled by .npmrc)
        run: npm ci --no-fund

      - name: Regression cases
        run: npm test

      - name: Preflight against the live official Playground sources
        run: node preflight.mjs

  web-verifier:
    name: web verifier (wasm build, tests)
    runs-on: ubuntu-24.04
    env:
      WASM_BINDGEN_VERSION: "0.2.128"
      WASM_BINDGEN_SHA256: "b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f"
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Node 24 (actions/setup-node v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Rust with the wasm32 target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: wasm-bindgen CLI (official release, checksum pinned)
        run: |
          f="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/$f"
          echo "${WASM_BINDGEN_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "WASM_BINDGEN=$RUNNER_TEMP/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" >> "$GITHUB_ENV"

      - name: Build the verifier
        run: scripts/build-verifier

      - name: Verifier tests (recorded devnet accounts)
        working-directory: web/verifier
        run: npm test
