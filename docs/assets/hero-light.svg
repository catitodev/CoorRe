<path d="M 400 0 V -112 H 438 A 30 30 0 0 1 438 -52 H 400 M 430 -52 L 468 0 M 496 -40 H 576 A 40 40 0 1 0 564.28 -11.72" fill="none" stroke="#10161A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text class="tagline" x="92" y="346" fill="#10161A" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500">Provable decisions for AI agents.</text>
