<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" role="img" aria-labelledby="t d">
<title id="t">CoorRe: evidence chained to an open C, released by one human signature</title>
<desc id="d">The CoorRe mark builds itself: three verdigris dots, each one a piece of evidence, chain along a line toward the opening of a C that stands for an automation limit. A single orange dot, the human signature, appears at the opening. The tagline reads: Provable decisions for AI agents.</desc>
<style>
@media (prefers-reduced-motion: no-preference) {
@keyframes line {
0% { opacity: 0; transform: scaleX(0); }
4.375% { opacity: 0; transform: scaleX(0); }
5% { opacity: 1; transform: scaleX(0); }
14.375% { opacity: 1; transform: scaleX(0.66); }
21.25% { opacity: 1; transform: scaleX(0.66); }
26.25% { opacity: 1; transform: scaleX(1); }
90% { opacity: 1; }
98.75% { opacity: 0; }
100% { opacity: 0; transform: scaleX(1); }
}
@keyframes dot3 {
0% { opacity: 0; transform: translateX(-140px); }
5% { opacity: 0; transform: translateX(-140px); }
6.25% { opacity: 1; transform: translateX(-140px); }
14.375% { opacity: 1; transform: translateX(0); }
90% { opacity: 1; }
98.75% { opacity: 0; }
100% { opacity: 0; transform: translateX(0); }
}
@keyframes dot2 {
0% { opacity: 0; transform: translateX(-70px); }
11.875% { opacity: 0; transform: translateX(-70px); }
13.125% { opacity: 1; transform: translateX(-70px); }
19.375% { opacity: 1; transform: translateX(0); }
90% { opacity: 1; }
98.75% { opacity: 0; }
100% { opacity: 0; transform: translateX(0); }
}
@keyframes dot1 {
0% { opacity: 0; transform: scale(0.5); }
18.125% { opacity: 0; transform: scale(0.5); }
21.875% { opacity: 1; transform: scale(1); }
90% { opacity: 1; }
98.75% { opacity: 0; }
100% { opacity: 0; transform: scale(1); }
}
@keyframes signature {
0% { opacity: 0; transform: scale(0.4); }
33.75% { opacity: 0; transform: scale(0.4); }
37.5% { opacity: 1; transform: scale(1); }
90% { opacity: 1; }
98.75% { opacity: 0; }
100% { opacity: 0; transform: scale(1); }
}
@keyframes tagline {
0% { opacity: 0; transform: translateY(6px); }
41.25% { opacity: 0; transform: translateY(6px); }
48.75% { opacity: 1; transform: translateY(0); }
90% { opacity: 1; }
98.75% { opacity: 0; }
100% { opacity: 0; transform: translateY(0); }
}
.line { transform-box: fill-box; transform-origin: 0% 50%; animation: line 16.0s linear infinite; }
.dot { transform-box: fill-box; transform-origin: 50% 50%; }
.dot1 { animation: dot1 16.0s cubic-bezier(0.45, 0.05, 0.25, 1) infinite; }
.dot2 { animation: dot2 16.0s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
.dot3 { animation: dot3 16.0s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
.signature { transform-box: fill-box; transform-origin: 50% 50%; animation: signature 16.0s cubic-bezier(0.45, 0.05, 0.25, 1) infinite; }
.tagline { animation: tagline 16.0s cubic-bezier(0.45, 0.05, 0.25, 1) infinite; }
}
</style>
