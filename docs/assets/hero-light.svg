<circle class="dot dot1" cx="176" cy="256" r="18" fill="#1F7A68"/>
<circle class="dot dot2" cx="246" cy="256" r="18" fill="#1F7A68"/>
<circle class="dot dot3" cx="316" cy="256" r="18" fill="#1F7A68"/>
<circle class="signature" cx="424" cy="256" r="31" fill="#E8531F"/>
</g>
