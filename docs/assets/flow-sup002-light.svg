<line class="trail" x1="64" y1="108" x2="64" y2="564" stroke="#1F7A68" stroke-width="6" stroke-linecap="round"/>
<g class="row1">
<circle cx="64" cy="108" r="10" fill="#1F7A68"/>
<text x="190" y="114" fill="#10161A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700">OPEN</text>
<text x="190" y="138" fill="#3D4A52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15">The buyer opens the case and escrows 0.20 SOL inside the program.</text>
</g>
<g class="row2">
<circle cx="64" cy="178" r="10" fill="#1F7A68"/>
<text x="190" y="184" fill="#10161A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700">SUBMITTED</text>
<text x="190" y="208" fill="#3D4A52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15">The supplier signs and submits two documents. Every step is signed evidence.</text>
</g>
<g class="row3">
<circle cx="64" cy="248" r="10" fill="#1F7A68"/>
<text x="190" y="254" fill="#10161A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700">AGENT_REVIEWED</text>
<text x="190" y="278" fill="#3D4A52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15">The AI agent recommends escalation. It can advise; it cannot release funds.</text>
</g>
<g class="row4">
<circle cx="64" cy="318" r="9" fill="#E9EEF0" stroke="#10161A" stroke-width="3"/>
<g transform="translate(72.80,266.80) scale(0.2)">
<path d="M 401.49 172.00 A 168 168 0 1 0 401.49 340.00" fill="none" stroke="#10161A" stroke-width="44" stroke-linecap="round"/>
<line x1="176" y1="256" x2="388" y2="256" stroke="#1F7A68" stroke-width="12" stroke-linecap="round"/>
<circle cx="176" cy="256" r="18" fill="#1F7A68"/>
<circle cx="246" cy="256" r="18" fill="#1F7A68"/>
<circle cx="316" cy="256" r="18" fill="#1F7A68"/>
</g>
<text x="190" y="324" fill="#10161A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700">AUTO_APPROVED, attempted</text>
<text x="190" y="348" fill="#3D4A52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15">The rule-engine key tries to approve 0.20 SOL. Its limit is 0.10 SOL.</text>
<text x="190" y="370" fill="#3D4A52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15">Rejected by the program: no transaction lands, no funds move.</text>
</g>
<text class="label4" x="462" y="325" fill="#E8531F" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700">MandateExceeded</text>
<g class="row5">
<circle cx="64" cy="424" r="10" fill="#1F7A68"/>
<text x="190" y="430" fill="#10161A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700">ESCALATED</text>
<text x="190" y="454" fill="#3D4A52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15">Reasons on record: environmental license expired; amount above the automation limit.</text>
