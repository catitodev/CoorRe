<text x="190" y="524" fill="#3D4A52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15">The approver signs with a human key. Only this signature passes the limit.</text>
</g>
<g class="row7">
<circle cx="64" cy="564" r="10" fill="#1F7A68"/>
<text x="190" y="570" fill="#10161A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700">ESCROW RELEASED</text>
<text x="190" y="594" fill="#3D4A52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15">0.20 SOL goes from the program to the supplier. Anyone can verify the whole trail.</text>
</g>
