<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" role="img" aria-labelledby="t d">
<title id="t">SUP-002: the program blocks an automation above its mandate; a human signature releases the payment</title>
<desc id="d">A 0.20 SOL payment is escrowed and the supplier submits two documents. The AI agent recommends escalation. The rule-engine key then tries to approve the payment, but its limit is 0.10 SOL, so the program rejects it with MandateExceeded: no transaction lands and no funds move. The case is escalated with two reasons, a human approver signs, and the escrow is released to the supplier.</desc>
