<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-labelledby="t d">
<title id="t">The seven verification checks, and what one changed byte does to them</title>
<desc id="d">Seven checks tick off one by one until the verifier reports 7 of 7 passed: artifact digests, evidence hashes, Ed25519 proofs, signer bound to the on-chain role key, hash chain, on-chain accounts, and automated decisions reproduced from the rule. Then one byte of a document changes from 7b to 7a, checks 1 and 7 turn red, and the result becomes 5 of 7.</desc>
